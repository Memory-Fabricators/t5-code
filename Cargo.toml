[package]
name = "t5-code"
version = "0.1.0"
edition = "2024"
autobins = false
license = "Apache-2.0"

[[bin]]
name = "t5-code"
path = "src/entrypoints/cli.rs"

[features]
default = [
    "ablation_baseline",
    "dump_system_prompt",
    "chicago_mcp",
    "daemon",
    "bridge_mode",
    "bg_sessions",
    "templates",
    "byoc_environment_runner",
    "self_hosted_runner",
]
ablation_baseline = []
dump_system_prompt = []
chicago_mcp = []
daemon = []
bridge_mode = []
bg_sessions = []
templates = []
byoc_environment_runner = []
self_hosted_runner = []

[profile.dev]
opt-level = 1
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
strip = "symbols"

[dependencies]
uu_grep = { git = "https://github.com/uutils/grep", rev = "a51da7ae4d5e6596cfe0df701e03e6d3b9bffe5a" }
brush-core = { git = "https://github.com/reubeno/brush", rev = "13be0752cae41d1fa3c346dcd29f4a546c6262d3" }
gag = "1.0"
glob = "0.3"
walkdir = "2"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
rand = { version = "0.10.2", features = ["simd_support"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "macros", "std", "all-widgets"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json", "http2"] }
rootcause = "0.13.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
